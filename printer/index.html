<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Document & Image Web Printer</title>
  <!-- Print.js Library via CDN for Web Printing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/print-js/1.6.0/print.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/print-js/1.6.0/print.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px 30px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    h2 { margin: 0 0 8px 0; font-size: 22px; color: var(--text); }
    p { margin: 0 0 24px 0; font-size: 14px; color: var(--muted); }
    .drop-zone {
      border: 2px dashed var(--brand);
      border-radius: 8px;
      background-color: var(--brand-soft);
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .drop-zone:hover, .drop-zone.dragover {
      background-color: color-mix(in srgb, var(--brand) 16%, var(--surface));
      border-color: var(--brand-2);
      transform: scale(1.01);
    }
    .icon { font-size: 42px; margin-bottom: 10px; }
    .label { font-size: 15px; font-weight: 600; color: var(--brand); }
    .sub-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    #status {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }
    input[type="file"] { display: none; }
    .home-btn {
      display: inline-flex; align-items: center; justify-content: center;
      text-decoration: none; color: #64748b; font-size: 13px; font-weight: 600;
      border: 1px solid #e2e8f0; border-radius: 999px; padding: 6px 12px;
      margin-bottom: 16px; background: #fff;
    }
    .home-btn:hover { color: var(--brand); border-color: var(--brand); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/goinfo-shell.css" />
  <script src="../assets/js/goinfo-shell.js"></script>
  <style>/* goinfo-shell-page */

    body.gi-body {
      display:block; align-items:unset; justify-content:unset;
      background:
        radial-gradient(circle at 8% 0%, rgba(11,99,246,.10), transparent 28rem),
        radial-gradient(circle at 95% 12%, rgba(105,65,198,.10), transparent 26rem),
        var(--bg);
      color: var(--text); font-family: var(--font);
      padding: 0; min-height: 100vh;
    }
    .card {
      margin: 40px auto; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); color: var(--text);
    }
    h2 { font-family: var(--font-display); font-weight: 400; color: var(--text); letter-spacing: -.03em; }
    p { color: var(--muted); }
    .drop-zone { border-color: var(--brand); background: var(--brand-soft); }
    .label { color: var(--brand); }
    .sub-label { color: var(--muted); }
    
  </style>
</head>
<body class="gi-body">
  <header class="gi-topbar">
    <div class="gi-wrap gi-nav">
      <a class="gi-brand" href="../" aria-label="GoInfo home">
        <span class="gi-brand-mark" aria-hidden="true">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
            <path d="M4 7.8 12 4l8 3.8-8 3.8-8-3.8Z" fill="currentColor"/>
            <path d="M6.5 10.4v5.1L12 19l5.5-3.5v-5.1L12 13l-5.5-2.6Z" fill="currentColor" opacity=".85"/>
          </svg>
        </span>
        <span class="gi-brand-name">Go<span>Info</span></span>
      </a>
      <nav class="gi-nav-links" aria-label="Main navigation">
        <a href="../">Home</a>
        <a href="../#tools">All tools</a>
      </nav>
      <div class="gi-nav-actions">
        <button class="gi-icon-btn" id="giThemeBtn" type="button" aria-label="Switch theme"></button>
      </div>
    </div>
  </header>


  <div class="card">
    <h2>🖨️ Web File Batch Printer</h2>
    <p>Supports PDF, JPG, and PNG files</p>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📁</div>
      <div class="label">Drag & Drop PDFs or Images Here</div>
      <div class="sub-label">Supports .pdf, .jpg, .jpeg, .png</div>
    </div>

    <!-- File selector input updated to accept images -->
    <input type="file" id="fileInput" multiple accept=".pdf, .jpg, .jpeg, .png" onchange="handleFiles(this.files)">

    <div id="status"></div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const statusDiv = document.getElementById('status');
    const allowedExtensions = ['pdf', 'jpg', 'jpeg', 'png'];

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
    });

    ['dragenter', 'dragover'].forEach(evt => {
      dropZone.addEventListener(evt, () => dropZone.classList.add('dragover'));
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover'));
    });

    dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

    async function handleFiles(files) {
      // Filter for valid PDF and image extensions
      const validFiles = Array.from(files).filter(f => {
        const ext = f.name.split('.').pop().toLowerCase();
        return allowedExtensions.includes(ext);
      });

      if (validFiles.length === 0) {
        setStatus('Please drop valid PDF, JPG, or PNG files!', '#ef4444');
        return;
      }

      for (let i = 0; i < validFiles.length; i++) {
        const file = validFiles[i];
        const ext = file.name.split('.').pop().toLowerCase();
        const objectUrl = URL.createObjectURL(file);
        
        // Determine print mode: 'pdf' for PDF files, 'image' for JPG/PNG
        const printType = (ext === 'pdf') ? 'pdf' : 'image';

        setStatus(`Preparing file ${i + 1} of ${validFiles.length}: ${file.name}`, '#d11f28');

        await new Promise((resolve) => {
          printJS({
            printable: objectUrl,
            type: printType,
            onPrintDialogClose: () => resolve(),
            onError: () => resolve()
          });
          // Buffer time between print jobs
          setTimeout(resolve, 1500);
        });
      }

      setStatus(`✅ Batch finished for ${validFiles.length} file(s)!`, '#10b981');
    }

    function setStatus(msg, color) {
      statusDiv.style.color = color;
      statusDiv.innerText = msg;
    }
  </script>
  <footer class="gi-footer">
    <div>© <span class="gi-year"></span> GoInfo. Useful tools, kept simple.</div>
    <div>Free browser tools for visa, study, printing and QR tasks.</div>
  </footer>
  <script>document.querySelectorAll('.gi-year').forEach(function(el){ el.textContent = new Date().getFullYear(); });</script>
</body>
</html>

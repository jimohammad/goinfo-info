  .price{font-size:1.25rem;font-weight:800;color:var(--ok);white-space:nowrap}
  .card.hot .price{color:var(--hot)}
  .supplier{font-size:1rem;font-weight:700;margin:0}
  .muted{color:var(--muted);font-size:.92rem;margin:6px 0 0}
  .pill{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#ffedd5;color:var(--hot);padding:4px 8px;border-radius:999px;margin-bottom:8px}
  .empty{text-align:center;color:var(--muted);padding:40px 12px}

function fingerprint(offers) {
  return (offers||[]).map(o => [o.Supplier,o.Model,o.PriceDisplay,o.Raw_Snippet].join('|')).join('||');
}
function escapeHtml(s) {
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render() {
  const q = (qEl.value || '').trim().toLowerCase();
  let offers = [...(data.offers || [])];
  offers.sort((a,b) => String(b.Hot||'0').localeCompare(String(a.Hot||'0')));
  if (q) {
    offers = offers.filter(o => `${o.Model} ${o.Supplier} ${o.Source_Chat} ${o.Notes} ${o.Raw_Snippet}`.toLowerCase().includes(q));
  }
  updatedEl.textContent = data.updated ? (`Updated ${data.updated} · ${offers.length} offers`) : `${offers.length} offers`;
  if (!offers.length) {
    listEl.innerHTML = '<div class="empty">No offers yet. Next WhatsApp scrape will fill this — then re-upload offers.html, or keep offers.json beside it.</div>';
    return;
  }
  listEl.innerHTML = offers.map(o => `
    <article class="card ${o.Hot==='1'?'hot':''}">
      ${o.Hot==='1' ? '<span class="pill">Hot deal</span>' : ''}
      <div class="row1">
        <div>
          <p class="model">${escapeHtml(o.Model || '—')}</p>
          <p class="supplier">${escapeHtml(o.Supplier || o.Source_Chat || '—')}</p>
        </div>
        <div class="price">${escapeHtml(o.PriceDisplay || '—')}</div>
      </div>
      <p class="muted">${escapeHtml(o.Source_Chat || '')}${o.Notes ? ' · ' + escapeHtml(o.Notes) : ''}</p>
      <p class="muted">${escapeHtml(o.Raw_Snippet || '')}</p>
    </article>`).join('');
}

async function load(opts = {}) {
  render(); // always show embedded/current data first
  try {
    const res = await fetch('offers.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const next = await res.json();
    if (!next || !Array.isArray(next.offers)) return;
    data = next;
    const fp = fingerprint(data.offers);
    const hotNew = data.offers.some(o => o.Hot === '1');
    if (opts.notify && fp && fp !== lastFingerprint) {
      ping(hotNew ? 'Hot phone deal update' : 'Phone offers updated', `${data.offers.length} offers · ${data.updated || ''}`);
    }
    lastFingerprint = fp;
    localStorage.setItem('offersFingerprint', fp);
    render();
  } catch (e) { /* keep embedded snapshot */ }
}

function ping(title, body) {
  if (Notification.permission === 'granted') {
    try { new Notification(title, { body, tag: 'phone-offers' }); } catch (_) {}
  }
}

notifyBtn.addEventListener('click', async () => {
  const p = await Notification.requestPermission();
  notifyBtn.textContent = p === 'granted' ? 'Pings on' : 'Pings blocked';
  notifyBtn.disabled = p === 'granted';
});
refreshBtn.addEventListener('click', () => load({ notify: false }));
qEl.addEventListener('input', render);
if (Notification.permission === 'granted') {
  notifyBtn.textContent = 'Pings on';
  notifyBtn.disabled = true;
}
load({ notify: false });
setInterval(() => load({ notify: true }), 60000);

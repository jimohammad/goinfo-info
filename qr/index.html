<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR code generator — GoInfo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Create and download custom QR codes in your browser. Free on GoInfo." />
  <link rel="canonical" href="https://goinfo.info/qr/" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --border: #1e293b;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
    }

    .app-shell {
      width: 100%;
      max-width: 980px;
      padding: 24px;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .home-btn {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 12px;
      background: rgba(2, 6, 23, 0.6);
    }
    .home-btn:hover { color: var(--accent); border-color: rgba(56, 189, 248, 0.45); }

    .app-card {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(14px);
    }

    @media (min-width: 800px) {
      .app-card {
        flex-direction: row;
        align-items: stretch;
      }
    }

    .left-panel {
      flex: 0.95;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .right-panel {
      flex: 1.05;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.09), rgba(15, 23, 42, 0.9));
      border: 1px solid rgba(51, 65, 85, 0.8);
      padding: 16px;
    }

    .field-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.35);
      background: #020617;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .color-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .color-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="color"] {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .color-hex {
      flex: 1;
      min-width: 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-main);
      padding: 7px 10px;
      font-size: 0.8rem;
      outline: none;
    }

    .color-hex:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.3);
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: flex-start;
      margin-top: 4px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease, border 0.18s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #0b1120;
      box-shadow:
        0 12px 30px rgba(56, 189, 248, 0.45),
        0 0 0 1px rgba(8, 47, 73, 0.9);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow:
        0 16px 40px rgba(56, 189, 248, 0.55),
        0 0 0 1px rgba(8, 47, 73, 0.9);
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.95);
      color: var(--text-main);
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    .btn-secondary:hover {
      background: rgba(15, 23, 42, 1);
      border-color: rgba(148, 163, 184, 0.8);
      transform: translateY(-1px);
    }

    .helper-text {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .preview-shell {
      width: min(360px, 100%);
      aspect-ratio: 1 / 1;
      max-height: 360px;
      border-radius: 24px;
      background:
        radial-gradient(circle at top, rgba(248, 250, 252, 0.12), transparent 55%),
        radial-gradient(circle at bottom, rgba(15, 23, 42, 0.9), #020617);
      border: 1px solid rgba(148, 163, 184, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .preview-shell::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 20px;
      border: 1px dashed rgba(148, 163, 184, 0.35);
      pointer-events: none;
    }

    #qrcode {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode canvas,
    #qrcode img {
      max-width: 88%;
      max-height: 88%;
      border-radius: 16px;
    }

    .preview-placeholder {
      text-align: center;
      z-index: 1;
    }

    .preview-placeholder-icon {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      font-size: 1.2rem;
    }

    .preview-placeholder-title {
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .preview-placeholder-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .status-line {
      font-size: 0.78rem;
      color: var(--accent);
      margin-top: 4px;
      min-height: 1em;
    }

    .status-line.error {
      color: #f97373;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <a class="home-btn" href="../">← Home</a>
    <div class="app-title">Custom QR Code Generator</div>

    <div class="app-card">
      <!-- LEFT: Controls -->
      <div class="left-panel">
        <div>
          <div class="field-label">Text or URL</div>
          <textarea
            id="qr-input"
            placeholder="Paste a URL or type any text to encode..."
          ></textarea>
          <div class="helper-text">
            Tip: Works with URLs, phone numbers, Wi-Fi passwords, or any plain text.
          </div>
        </div>

        <div class="row">
          <div class="color-field">
            <div class="field-label">Foreground</div>
            <div class="color-input-wrap">
              <input type="color" id="color-dark" value="#000000" />
              <input
                type="text"
                id="color-dark-hex"
                class="color-hex"
                value="#000000"
                maxlength="9"
              />
            </div>
          </div>

          <div class="color-field">
            <div class="field-label">Background</div>
            <div class="color-input-wrap">
              <input type="color" id="color-light" value="#ffffff" />
              <input
                type="text"
                id="color-light-hex"
                class="color-hex"
                value="#ffffff"
                maxlength="9"
              />
            </div>
          </div>
        </div>

        <div class="actions-row">
          <button class="btn btn-primary" id="generate-btn">
            <span>Generate QR</span>
          </button>
          <button class="btn btn-secondary" id="download-btn">
            <span>Download PNG</span>
          </button>
          <span class="helper-text">PNG export uses the current preview.</span>
        </div>

        <div id="status" class="status-line"></div>
      </div>

      <!-- RIGHT: Large Preview -->
      <div class="right-panel">
        <div class="preview-shell">
          <div id="qrcode">
            <div class="preview-placeholder" id="placeholder">
              <div class="preview-placeholder-icon">▢</div>
              <div class="preview-placeholder-title">No QR yet</div>
              <div class="preview-placeholder-sub">
                Add content and tap “Generate QR” to see a live preview.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- QRCode.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    const inputEl = document.getElementById("qr-input");
    const darkColorInput = document.getElementById("color-dark");
    const lightColorInput = document.getElementById("color-light");
    const darkHexInput = document.getElementById("color-dark-hex");
    const lightHexInput = document.getElementById("color-light-hex");
    const generateBtn = document.getElementById("generate-btn");
    const downloadBtn = document.getElementById("download-btn");
    const statusEl = document.getElementById("status");
    const qrcodeContainer = document.getElementById("qrcode");
    const placeholder = document.getElementById("placeholder");

    let lastQRCode = null;

    function syncColorInputs(colorPicker, hexInput) {
      // picker -> hex
      colorPicker.addEventListener("input", () => {
        hexInput.value = colorPicker.value;
      });

      // hex -> picker (basic validation)
      hexInput.addEventListener("change", () => {
        const value = hexInput.value.trim();
        const normalized = normalizeColorHex(value);
        if (normalized) {
          hexInput.value = normalized;
          colorPicker.value = normalized;
          status("");
        } else {
          status("Invalid color hex. Use formats like #000000 or #09f.", true);
        }
      });
    }

    function normalizeColorHex(str) {
      if (!str) return null;
      let v = str.trim().toLowerCase();
      if (!v.startsWith("#")) v = "#" + v;
      if (/^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/.test(v)) {
        return v;
      }
      return null;
    }

    function status(message, isError) {
      statusEl.textContent = message || "";
      statusEl.classList.toggle("error", !!isError);
    }

    function clearQRCode() {
      qrcodeContainer.innerHTML = "";
    }

    function showPlaceholder() {
      clearQRCode();
      qrcodeContainer.appendChild(placeholder);
    }

    function generateQRCode() {
      const text = inputEl.value.trim();

      if (!text) {
        status("Please enter text or a URL before generating.", true);
        showPlaceholder();
        return;
      }

      const darkColor = normalizeColorHex(darkHexInput.value) || "#000000";
      const lightColor = normalizeColorHex(lightHexInput.value) || "#ffffff";

      darkHexInput.value = darkColor;
      lightHexInput.value = lightColor;
      darkColorInput.value = darkColor;
      lightColorInput.value = lightColor;

      clearQRCode();

      const size = 320; // base size for high-quality preview & PNG

      lastQRCode = new QRCode(qrcodeContainer, {
        text,
        width: size,
        height: size,
        colorDark: darkColor,
        colorLight: lightColor,
        correctLevel: QRCode.CorrectLevel.H
      });

      status("QR code generated.");
    }

    function downloadPNG() {
      // Prefer canvas if available
      const canvas = qrcodeContainer.querySelector("canvas");
      const img = qrcodeContainer.querySelector("img");

      if (!canvas && !img) {
        status("Generate a QR code before downloading.", true);
        return;
      }

      let dataURL;

      if (canvas) {
        dataURL = canvas.toDataURL("image/png");
      } else if (img) {
        // Fallback: draw the <img> onto a temporary canvas
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = img.naturalWidth || 320;
        tempCanvas.height = img.naturalHeight || 320;
        const ctx = tempCanvas.getContext("2d");
        ctx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
        dataURL = tempCanvas.toDataURL("image/png");
      }

      if (!dataURL) {
        status("Unable to export PNG in this browser.", true);
        return;
      }

      const link = document.createElement("a");
      link.href = dataURL;
      link.download = "qr-code.png";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      status("PNG downloaded.");
    }

    // Wire up events
    generateBtn.addEventListener("click", generateQRCode);
    downloadBtn.addEventListener("click", downloadPNG);

    inputEl.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        generateQRCode();
      }
    });

    syncColorInputs(darkColorInput, darkHexInput);
    syncColorInputs(lightColorInput, lightHexInput);

    // Initial placeholder
    showPlaceholder();
  </script>
</body>
</html>
